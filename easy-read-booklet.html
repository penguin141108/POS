<!doctype html>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="我可以決定自己的事"/>
<title>易讀自評手冊</title>
<style>
  :root{--ink:#243b53;--bg:#eef4fa;--card:#fff;--line:#243b53;--accent:#2b8ac6;--good:#2fb37a;--sub:#6b7f92;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Arial Rounded MT Bold','SF Pro Rounded',system-ui,'PingFang TC','Microsoft JhengHei',sans-serif;}
  .wrap{max-width:820px;margin:0 auto;padding:10px 12px 96px;}
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .btn{border:none;font-family:inherit;font-weight:900;cursor:pointer;border-radius:12px;}
  .icon{background:#fff;border:2px solid var(--line);color:var(--ink);height:46px;min-width:46px;padding:0 12px;font-size:18px;}
  .icon:active{transform:translateY(2px);}
  .crumb{font-size:15px;color:var(--sub);font-weight:900;}
  .name{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sub);margin-left:auto;}
  .name input{border:2px solid #c7d6e5;border-radius:10px;padding:6px 8px;font-size:15px;width:110px;font-family:inherit;}
  .head{text-align:center;margin:2px 0 6px;}
  .head .lab{font-size:26px;font-weight:900;}
  .pic{background:var(--card);border:3px solid var(--line);border-radius:16px;min-height:120px;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;color:var(--sub);}
  .pic img{max-width:100%;max-height:52vh;object-fit:contain;border-radius:8px;}
  .pic.ph{font-size:20px;font-weight:900;color:#9fb2c4;min-height:180px;}
  .opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:14px;}
  .opt{background:#fff;border:4px solid var(--line);border-radius:18px;padding:12px;min-width:130px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .opt.on{border-color:var(--good);background:#e8f8f0;}
  .opt:active{transform:translateY(2px);}
  .opt .oimg{width:96px;height:96px;display:flex;align-items:center;justify-content:center;border-radius:12px;overflow:hidden;background:#f2f7fb;font-size:14px;color:#9fb2c4;font-weight:900;text-align:center;}
  .opt .oimg img{width:100%;height:100%;object-fit:contain;}
  .opt .olab{font-size:20px;font-weight:900;}
  .nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 12px;background:rgba(238,244,250,.96);border-top:2px solid #d5e2ee;}
  .nav .big{flex:1;font-size:20px;padding:16px;background:var(--accent);color:#fff;}
  .nav .big:active{transform:translateY(2px);} .nav .big:disabled{background:#c0cdd9;}
  .spk{background:var(--accent);color:#fff;border:2px solid var(--line);height:46px;min-width:46px;font-size:20px;}
  #cover{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;z-index:30;}
  #cover .cp{max-width:92%;max-height:60vh;object-fit:contain;border:3px solid var(--line);border-radius:16px;background:#fff;min-height:200px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:var(--ink);padding:14px;text-align:center;}
  #cover .cp img{max-width:100%;max-height:58vh;object-fit:contain;}
  #cover .go{background:var(--good);color:#fff;font-size:26px;padding:18px 44px;border-radius:20px;box-shadow:0 6px 0 #1f8a5c;}
  #cover .go:active{transform:translateY(3px);box-shadow:0 2px 0 #1f8a5c;}
  #cover .adm{background:#6b7f92;color:#fff;border:none;font-family:inherit;font-weight:900;font-size:15px;padding:10px 16px;border-radius:12px;}
  .ov{position:fixed;inset:0;background:rgba(20,40,60,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:40;}
  .ov.show{display:flex;}
  .sheet{background:#fff;border:3px solid var(--line);border-radius:18px;max-width:620px;width:100%;padding:18px;max-height:90vh;overflow:auto;}
  .sheet h2{margin:0 0 6px;}
  .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .acts .b{padding:12px 16px;font-size:16px;background:#fff;border:2px solid var(--line);color:var(--ink);border-radius:12px;font-family:inherit;font-weight:900;cursor:pointer;}
  .acts .prime{background:var(--good);color:#fff;border-color:var(--good);}
  .ne{border:2px solid #e2ecf5;border-radius:12px;padding:10px;margin:8px 0;}
  .ne label{display:block;font-size:12px;color:var(--sub);font-weight:900;margin:6px 0 3px;}
  .ne input[type=text]{width:100%;border:2px solid #c7d6e5;border-radius:8px;padding:7px 9px;font-size:16px;font-family:inherit;}
  .ne .file{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-top:4px;}
  .ne .thumb{width:54px;height:54px;border:1px solid #dce7f1;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:10px;color:#9fb2c4;}
  .ne .thumb img{width:100%;height:100%;object-fit:contain;}
  .row{display:flex;align-items:center;gap:8px;border-top:1px solid #eef3f8;padding:8px 0;}
  .row .g{flex:1;font-weight:900;}
  .small{font-size:13px;padding:6px 10px;border-radius:8px;border:2px solid var(--line);background:#fff;font-family:inherit;font-weight:900;cursor:pointer;}
  .small.rec{background:#f87171;color:#fff;border-color:#f87171;}
  .note{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.6;}
</style>

<div id="cover">
  <div class="cp" id="coverPic"></div>
  <button class="btn go" id="startBtn">▶ 開始</button>
  <button class="adm" id="coverAdmin">⚙ 後台設定</button>
</div>

<div class="wrap">
  <div class="bar">
    <button class="btn icon" id="homeBtn">🏠</button>
    <button class="btn spk" id="spkBtn">🔊</button>
    <span class="crumb" id="crumb"></span>
    <span class="name">姓名<input id="uname" placeholder="(工作人員填)"/></span>
    <button class="btn icon" id="logBtn">紀錄</button>
  </div>
  <div class="head"><div class="lab" id="headLab"></div></div>
  <div class="pic" id="pic"></div>
  <div class="opts" id="opts"></div>
</div>

<div class="nav">
  <button class="btn big" id="prev">← 上一頁</button>
  <button class="btn big" id="next">下一頁 →</button>
</div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="ov" id="admOv"><div class="sheet" id="admSheet"></div></div>

<script>
const CFGKEY="erb_config", LOGKEY="erb_logs";
const SEED={ cover:{label:"封面標題",img:"",audio:""}, themes:[] };
for(let _i=1;_i<=8;_i++){ SEED.themes.push({label:"主題 "+_i,img:"",audio:"",subs:[
  {label:"主標題 1",img:"",audio:"",options:[{label:"選項 1",img:"",audio:""}]}
]}); }
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}
let DATA=SEED; try{const s=JSON.parse(localStorage.getItem(CFGKEY)||"null"); if(s&&s.themes)DATA=s;}catch(e){}
function saveCfg(){try{localStorage.setItem(CFGKEY,JSON.stringify(DATA));return true;}catch(e){return false;}}

let screens=[], idx=0, sel={};
function buildScreens(){ screens=[]; DATA.themes.forEach((t,ti)=>{ screens.push({kind:"theme",ti}); t.subs.forEach((s,si)=>screens.push({kind:"sub",ti,si})); }); }

// ---------- audio ----------
let AC=null,curAudio=null,guiding=false,gtok=0,gtimer=null;
function initAudio(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();AC.onstatechange=()=>{if(AC.state!=="running")AC.resume();};}if(AC.state!=="running")AC.resume();const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);}catch(e){}}
function stopAudio(){if(curAudio){try{curAudio.pause();}catch(e){}curAudio=null;}try{speechSynthesis.cancel();}catch(e){}}
function playNode(node,cb){ stopAudio();
  if(node.audio){try{const a=new Audio(node.audio);curAudio=a;let d=false;const f=()=>{if(d)return;d=true;if(curAudio===a)curAudio=null;cb&&cb();};a.onended=f;a.onerror=f;const p=a.play();if(p&&p.catch)p.catch(f);setTimeout(f,12000);}catch(e){cb&&cb();}}
  else{try{const u=new SpeechSynthesisUtterance(node.label||"");u.lang="zh-TW";u.rate=.9;const v=speechSynthesis.getVoices().find(v=>/zh|Chinese|Mandarin/i.test(v.lang+" "+v.name));if(v)u.voice=v;let d=false;const f=()=>{if(d)return;d=true;cb&&cb();};u.onend=f;u.onerror=f;speechSynthesis.speak(u);setTimeout(f,5000);}catch(e){cb&&cb();}}
}
function stopGuide(){guiding=false;gtok++;if(gtimer){clearTimeout(gtimer);gtimer=null;}stopAudio();const b=$("spkBtn");if(b)b.textContent="🔊";}
function buildSteps(sc){
  const s=[];
  if(sc.kind==="theme"){ const t=DATA.themes[sc.ti]; for(let k=0;k<3;k++)s.push({node:t,gap:3000}); s[s.length-1].gap=0; return s; }
  const sub=DATA.themes[sc.ti].subs[sc.si];
  for(let k=0;k<3;k++)s.push({node:sub,gap:3000}); s[s.length-1].gap=10000;
  sub.options.forEach(o=>{ for(let k=0;k<3;k++)s.push({node:o,gap:3000}); s[s.length-1].gap=10000; });
  s[s.length-1].gap=0; return s;
}
function startGuide(){ stopGuide();guiding=true;const my=++gtok;const steps=buildSteps(screens[idx]);$("spkBtn").textContent="⏹";let i=0;
  const nx=()=>{if(my!==gtok)return;if(i>=steps.length){guiding=false;$("spkBtn").textContent="🔊";return;}const st=steps[i++];playNode(st.node,()=>{if(my!==gtok)return;gtimer=setTimeout(nx,st.gap);});};nx();
}

// ---------- render ----------
function picHTML(node){ return node.img?`<img src="${node.img}" alt="">`:`<div class="ph-in">（尚未上傳圖片）<br>${esc(node.label)}</div>`; }
function show(i){
  idx=Math.max(0,Math.min(screens.length-1,i)); const sc=screens[idx];
  $("prev").disabled=idx<=0; $("next").disabled=idx>=screens.length-1;
  const opts=$("opts"); opts.innerHTML="";
  if(sc.kind==="theme"){
    const t=DATA.themes[sc.ti]; $("crumb").textContent="主題 "+(sc.ti+1)+"／"+DATA.themes.length;
    $("headLab").textContent=t.label;
    $("pic").className="pic"+(t.img?"":" ph"); $("pic").innerHTML=t.img?`<img src="${t.img}">`:esc(t.label);
  } else {
    const t=DATA.themes[sc.ti], sub=t.subs[sc.si]; const key=sc.ti+"_"+sc.si; sel[key]=sel[key]||[];
    $("crumb").textContent=t.label+"　主標題 "+(sc.si+1)+"／"+t.subs.length;
    $("headLab").textContent=sub.label;
    $("pic").className="pic"+(sub.img?"":" ph"); $("pic").innerHTML=sub.img?`<img src="${sub.img}">`:esc(sub.label);
    sub.options.forEach((o,k)=>{ const d=document.createElement("div"); d.className="opt"+(sel[key].includes(k)?" on":"");
      d.innerHTML=`<div class="oimg">${o.img?`<img src="${o.img}">`:"（無圖）"}</div><div class="olab">${esc(o.label)}</div>`;
      d.onclick=()=>{ stopGuide(); const a=sel[key],j=a.indexOf(k); if(j<0)a.push(k);else a.splice(j,1); show(idx); playNode(o,null); };
      opts.appendChild(d);
    });
  }
  startGuide();
}
$("prev").onclick=()=>{stopGuide();show(idx-1);};
$("next").onclick=()=>{stopGuide();show(idx+1);};
$("spkBtn").onclick=()=>{if(guiding)stopGuide();else startGuide();};
$("homeBtn").onclick=()=>{stopGuide();$("cover").style.display="flex";};

// cover
function paintCover(){ const c=DATA.cover; $("coverPic").innerHTML=c.img?`<img src="${c.img}">`:esc(c.label); }
$("startBtn").onclick=()=>{ initAudio(); $("cover").style.display="none"; buildScreens(); show(0); };
$("coverAdmin").onclick=()=>admOpen();

// ---------- records ----------
function nowStr(){const d=new Date(),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());}
function summary(){ let out=[]; DATA.themes.forEach((t,ti)=>{ t.subs.forEach((s,si)=>{ const a=sel[ti+"_"+si]; if(a&&a.length) out.push("· "+s.label+"："+a.map(k=>s.options[k].label).join("、")); }); });
  return "【"+DATA.cover.label+"｜自評】\n姓名："+($("uname").value.trim()||"—")+"　日期："+nowStr()+"\n\n"+(out.join("\n")||"（尚未勾選）"); }
$("logBtn").onclick=()=>{ const txt=summary();
  try{const logs=JSON.parse(localStorage.getItem(LOGKEY)||"[]");logs.unshift({name:$("uname").value.trim(),date:nowStr(),text:txt});localStorage.setItem(LOGKEY,JSON.stringify(logs.slice(0,100)));}catch(e){}
  $("sheet").innerHTML="<h2>本次紀錄</h2><div style='white-space:pre-wrap;font-size:15px'>"+esc(txt)+"</div><div class='acts'><button class='b prime' id='cp'>📋 複製給工作人員</button><button class='b' id='cl'>關閉</button></div>";
  $("ov").classList.add("show"); $("cl").onclick=()=>$("ov").classList.remove("show");
  $("cp").onclick=()=>{ if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>$("cp").textContent="已複製 ✓").catch(fb);else fb();
    function fb(){const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand("copy");$("cp").textContent="已複製 ✓";}catch(e){alert(txt);}t.remove();} };
};

// ---------- 後台 ----------
let edit=null, aView="home", aTi=0, aSi=0;
function fileToURI(input,cb){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f);}
function admOpen(){ stopGuide(); edit=JSON.parse(JSON.stringify(DATA)); aView="home"; buildAdmin(); $("admOv").classList.add("show"); }
function admClose(){ $("admOv").classList.remove("show"); }
function nodeEditor(node,idpfx){
  return `<div class="ne">
    <label>文字</label><input type="text" id="${idpfx}_lab" value="${esc(node.label)}">
    <div class="file"><span class="thumb">${node.img?`<img src="${node.img}">`:"無圖"}</span>
      <label>圖片<input type="file" accept="image/*" id="${idpfx}_img" style="display:block"></label>
      ${node.img?`<button class="small" id="${idpfx}_imgclr">清除圖</button>`:""}</div>
    <div class="file">語音：${node.audio?"已設定 ✓":"（無，改用系統語音）"}
      <button class="small" id="${idpfx}_rec">🎙 錄音</button>
      ${node.audio?`<button class="small" id="${idpfx}_play">▶ 試聽</button>`:""}
      <label class="small" style="cursor:pointer">📁 上傳<input type="file" accept="audio/*" id="${idpfx}_aud" style="display:none"></label>
      ${node.audio?`<button class="small" id="${idpfx}_audclr">清除音</button>`:""}</div>
  </div>`;
}
function wireNode(node,idpfx,after){
  $(idpfx+"_lab").oninput=e=>node.label=e.target.value;
  $(idpfx+"_img").onchange=e=>fileToURI(e.target,u=>{node.img=u;after();});
  $(idpfx+"_aud").onchange=e=>fileToURI(e.target,u=>{node.audio=u;after();});
  const rc=$(idpfx+"_rec"); if(rc)rc.onclick=()=>toggleRec(node,rc,after);
  const pl=$(idpfx+"_play"); if(pl)pl.onclick=()=>playNode(node,null);
  const ic=$(idpfx+"_imgclr"); if(ic)ic.onclick=()=>{node.img="";after();};
  const ac=$(idpfx+"_audclr"); if(ac)ac.onclick=()=>{node.audio="";after();};
}
let recRec=null, recStream=null, recChunks=[];
async function toggleRec(node,btn,after){
  if(recRec && recRec.state==="recording"){ recRec.stop(); return; }
  stopAudio();
  try{ recStream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ alert("拿不到麥克風：請用 Safari／Chrome、允許麥克風權限，且網址須為 https（GitHub Pages 可，本機 file:// 不行）。"); return; }
  recChunks=[];
  try{ recRec=new MediaRecorder(recStream); }catch(e){ alert("這台裝置不支援錄音（MediaRecorder）。"); recStream.getTracks().forEach(t=>t.stop()); return; }
  recRec.ondataavailable=e=>{ if(e.data&&e.data.size) recChunks.push(e.data); };
  recRec.onstop=()=>{ const blob=new Blob(recChunks,{type:(recChunks[0]&&recChunks[0].type)||"audio/mp4"});
    const r=new FileReader(); r.onload=()=>{ node.audio=r.result; if(recStream){recStream.getTracks().forEach(t=>t.stop());recStream=null;} recRec=null; after(); }; r.readAsDataURL(blob); };
  recRec.start(); btn.textContent="■ 停止錄音"; btn.classList.add("rec");
  setTimeout(()=>{ if(recRec && recRec.state==="recording") recRec.stop(); }, 60000);
}
function admBtns(){ return `<div class="acts">
  <button class="b prime" id="a_save">儲存並套用</button><button class="b" id="a_cancel">取消</button>
  <button class="b" id="a_export">⬇ 匯出設定</button>
  <label class="b" style="cursor:pointer">⬆ 匯入設定<input type="file" accept="application/json,.json" id="a_import" style="display:none"></label>
  <button class="b" id="a_reset">還原預設</button></div>
  <div class="note">封面/主題/主標題/選項，每一層都能上傳圖片與語音。設定太大（音檔多）可能存不進裝置，請用「匯出設定」保存並在各台匯入。</div>`; }
function admWire(){
  $("a_save").onclick=()=>{DATA=edit;const ok=saveCfg();paintCover();buildScreens();sel={};admClose();if(!ok)alert("已套用到目前畫面，但設定太大無法存進裝置長期記憶。請用「匯出設定」保存。");};
  $("a_cancel").onclick=admClose; $("a_export").onclick=admExport; $("a_reset").onclick=()=>{if(confirm("還原成內建預設？")){edit=JSON.parse(JSON.stringify(SEED));aView="home";buildAdmin();}};
  $("a_import").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j&&j.themes){edit=j;aView="home";buildAdmin();}else alert("設定格式不正確");}catch(err){alert("無法讀取設定");}};r.readAsText(f);};
}
function admExport(){const b=new Blob([JSON.stringify(edit)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="booklet-config.json";document.body.appendChild(a);a.click();a.remove();}
function buildAdmin(){
  const S=$("admSheet");
  if(aView==="home"){
    S.innerHTML=`<h2>後台設定</h2><div class="ne" style="border-color:var(--accent)"><label style="font-weight:900;color:var(--ink)">封面</label>${nodeEditor(edit.cover,"cv")}</div>
      <div style="font-weight:900;margin:10px 0 4px">主題（共 ${edit.themes.length}）</div><div id="thlist"></div>
      <button class="b" id="a_addtheme" style="margin-top:6px">＋ 新增主題</button>${admBtns()}`;
    wireNode(edit.cover,"cv",()=>buildAdmin());
    const tl=$("thlist"); edit.themes.forEach((t,ti)=>{const r=document.createElement("div");r.className="row";
      r.innerHTML=`<span class="g">${ti+1}. ${esc(t.label)||"（未命名）"} <small style="color:var(--sub)">（${t.subs.length} 個主標題）</small></span>
        <button class="small" data-ed="${ti}">編輯</button><button class="small" data-del="${ti}">刪</button>`; tl.appendChild(r);});
    tl.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{aTi=+b.dataset.ed;aView="theme";buildAdmin();});
    tl.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("刪除這個主題？")){edit.themes.splice(+b.dataset.del,1);buildAdmin();}});
    $("a_addtheme").onclick=()=>{edit.themes.push({label:"新主題",img:"",audio:"",subs:[]});buildAdmin();};
    admWire();
  } else if(aView==="theme"){
    const t=edit.themes[aTi];
    S.innerHTML=`<div class="crumb">後台 › 主題 ${aTi+1}</div><h2>編輯主題</h2>${nodeEditor(t,"th")}
      <div style="font-weight:900;margin:10px 0 4px">主標題（共 ${t.subs.length}）</div><div id="sblist"></div>
      <button class="b" id="a_addsub" style="margin-top:6px">＋ 新增主標題</button>
      <div class="acts"><button class="b" id="a_back">← 返回主題列表</button></div>`;
    wireNode(t,"th",()=>buildAdmin());
    const sl=$("sblist"); t.subs.forEach((s,si)=>{const r=document.createElement("div");r.className="row";
      r.innerHTML=`<span class="g">${si+1}. ${esc(s.label)||"（未命名）"} <small style="color:var(--sub)">（${s.options.length} 選項）</small></span>
        <button class="small" data-ed="${si}">編輯</button><button class="small" data-del="${si}">刪</button>`;sl.appendChild(r);});
    sl.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{aSi=+b.dataset.ed;aView="sub";buildAdmin();});
    sl.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("刪除這個主標題？")){t.subs.splice(+b.dataset.del,1);buildAdmin();}});
    $("a_addsub").onclick=()=>{t.subs.push({label:"新主標題",img:"",audio:"",options:[]});buildAdmin();};
    $("a_back").onclick=()=>{aView="home";buildAdmin();};
  } else {
    const t=edit.themes[aTi], s=t.subs[aSi];
    S.innerHTML=`<div class="crumb">後台 › ${esc(t.label)} › 主標題 ${aSi+1}</div><h2>編輯主標題</h2>${nodeEditor(s,"sb")}
      <div style="font-weight:900;margin:10px 0 4px">選項（共 ${s.options.length}）</div><div id="oplist"></div>
      <button class="b" id="a_addopt" style="margin-top:6px">＋ 新增選項</button>
      <div class="acts"><button class="b" id="a_back">← 返回主標題列表</button></div>`;
    wireNode(s,"sb",()=>buildAdmin());
    const ol=$("oplist"); s.options.forEach((o,oi)=>{const d=document.createElement("div");d.className="ne";
      d.innerHTML=`<div class="row" style="border:0;padding:0"><span class="g">選項 ${oi+1}</span><button class="small" data-del="${oi}">刪</button></div>${nodeEditor(o,"op"+oi)}`;ol.appendChild(d);});
    s.options.forEach((o,oi)=>wireNode(o,"op"+oi,()=>buildAdmin()));
    ol.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{s.options.splice(+b.dataset.del,1);buildAdmin();});
    $("a_addopt").onclick=()=>{s.options.push({label:"新選項",img:"",audio:""});buildAdmin();};
    $("a_back").onclick=()=>{aView="theme";buildAdmin();};
  }
}
paintCover();
</script>
